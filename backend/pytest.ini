[pytest]
# Solo las pruebas de tests/ (BD temporal). scripts/test_suite.py es una prueba de
# sistema contra el servidor real y se ejecuta a mano:  python scripts/test_suite.py
testpaths = tests
markers =
    integration: pruebas que recorren la API completa sobre la BD temporal
filterwarnings =
    ignore:Using .httpx. with .starlette.testclient. is deprecated:starlette.exceptions.StarletteDeprecationWarning
