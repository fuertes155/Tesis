name: Compatibilidad de navegadores y Android
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browsers:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          cache: true
      - run: pip install httpx playwright==1.64.1
      - run: python -m playwright install firefox
      - run: flutter pub get
      - run: flutter build web --release
      - run: python scripts/qa/run_browsers.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatibilidad-web
          path: artifacts/compatibility/
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: flutter pub get
      - name: Habilitar aceleración KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: flutter test integration_test/compatibility_smoke_test.dart -d emulator-5554 --reporter expanded
