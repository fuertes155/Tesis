name: Regresión automática
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Pruebas con BD temporal y cobertura de ramas
        working-directory: backend
        run: python -m pytest --cov=app --cov=main --cov-branch --cov-report=xml --cov-report=term-missing --junitxml=../artifacts/backend.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-pruebas
          path: |
            artifacts/backend.xml
            backend/coverage.xml
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test --coverage --reporter expanded
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-cobertura
          path: coverage/lcov.info
